<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="/contact-me">
        <label for="Date">Date</label>
        <input id="Date" type="Date"> <br>

        <label for="File">File</label>
        <input id="File" type="file"> <br>

        <label for="Color">Color</label>
        <input id="Color" type="Color"><br>

        <label for="Price Range">Price Range</label>
        <input id="Price Range" type="range"><br>

        <label for="Button">Thulluu</label>
        <input id="Button" type="button" value="CLICK "><br>

         <label for="submit">Submit</label>
        <input id="submit" type="submit" value="CLICK "> <br>

        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">  <br>

        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female"> <br>

        <label for="other">Other</label>
        <input type="radio" id="other" name="gender" value="other"> <br>

        <label for="c">C</label>
        <input type="checkbox" name="lang" id="c" value="c"> <br>

        <label for="java">Java</label>
        <input type="checkbox" name="lang" id="java" value="java"> <br>

        <label for="python">Python</label>
        <input type="checkbox" name="lang" id="python" value="Python"> <br>\

        <label for="country">Choose a country</label>
        <select name="country" id="country">
            <option value="India">India</option>
            <option value="Bharat">Bharat</option>
            <option value="Hindustan">Hindustan</option>
            <option value="Jambudweep">Jambudweep</option>
            <option value="Ravakhand">Ravakhand</option>
            <option value="Aaryavrat">Aaryavrat</option>
        </select> <br>

        <textarea name="Story" id="Story">Please Write Your Feedback</textarea>
    </form>    
</body>
</html>
